spring.application.name=payment-service
server.port=8084

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka: Dùng biến môi trường KAFKA_BOOTSTRAP_SERVERS, nếu không có sẽ tự lấy localhost cho chạy local
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=payment-group

# Actuator & Tracing
management.endpoints.web.exposure.include=*
management.prometheus.metrics.export.enabled=true
management.otlp.metrics.export.enabled=false

management.tracing.sampling.probability=1.0

# Tracing Endpoint: Dùng biến môi trường, nếu chạy local sẽ fallback về localhost:4317 hoặc tắt
management.otlp.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4317}

logging.pattern.level=%d{yyyy-MM-dd HH:mm:ss} [%X{traceId:-},%X{spanId:-}] [%thread] %-5level %logger{36} - %msg%n
